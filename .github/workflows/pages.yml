name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Point the static site at your backend, if you've deployed one.
      # Set it in: repo Settings → Secrets and variables → Actions → Variables → API_BASE
      - name: Write frontend config
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node -e 'const fs=require("fs");const b=(process.env.API_BASE||"").trim();fs.writeFileSync("public/js/config.js","window.APP_CONFIG = { apiBase: "+JSON.stringify(b)+" };\n");'
          cat public/js/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
